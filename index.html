<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحل الذكي</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; margin-bottom: 5px; font-size: 24px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 25px; font-size: 14px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; flex: 1; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; background: #fafafa; }
        input:focus, select:focus { border-color: #6c5ce7; box-shadow: 0 0 8px rgba(108, 92, 231, 0.2); background: #fff; }
        button { width: 100%; padding: 14px; background: #6c5ce7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #5a4bcf; }
        button:disabled { background: #a29bfe; cursor: not-allowed; }
        .hidden { display: none; }
        #result { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-size: 15px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>منصة الحل الذكي</h1>
        <p class="subtitle">حل تمارين QUREO في ثواني</p>
        
        <form id="solveForm">
            <div class="row">
                <div class="input-group">
                    <label>السنة الدراسية</label>
                    <select id="grade">
                        <option value="1">أولى ثانوي</option>
                        <option value="2">تانية ثانوي</option>
                        <option value="3">ثالثة ثانوي</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>اللغة</label>
                    <select id="language">
                        <option value="js">JavaScript</option>
                        <option value="py">Python</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label>رقم الطالب (ID)</label>
                <input type="text" id="student_id" placeholder="أدخل رقم الطالب" required>
            </div>
            
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            
            <button type="submit" id="submitBtn">ابدأ الحل الآن</button>
        </form>
        
        <div id="result" class="hidden"></div>
    </div>

    <script>
        document.getElementById('solveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            btn.innerText = "جاري الاتصال...";
            btn.disabled = true;
            resultDiv.classList.add('hidden');

            const data = {
                student_id: document.getElementById('student_id').value,
                password: document.getElementById('password').value,
                grade: document.getElementById('grade').value,
                language: document.getElementById('language').value
            };

            try {
                const response = await fetch('/api/solve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                resultDiv.classList.remove('hidden');
                if(result.status === 'success') {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `${result.message}<br><small>${result.details}</small>`;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `${result.message}`;
                }
            } catch (err) {
                resultDiv.classList.remove('hidden');
                resultDiv.className = 'error';
                resultDiv.innerText = "حدث خطأ في الاتصال بالسيرفر.";
            } finally {
                btn.innerText = "ابدأ الحل الآن";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
